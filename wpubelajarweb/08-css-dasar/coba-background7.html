<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiple Background</title>
    <style>
      body {
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background-color: #333;
      }

      .frame {
        width: 400px;
        height: 400px;
        border: 10px solid white;
        margin: auto;
        background-image: url(img/), url(img/), url(img/);
        background-size: 500px, 320px, 450px;
        background-repeat: no-repeat, no-repeat, no-repeat;
        background-position:
          center bottom,
          center bottom,
          center bottom;
        background-color: lightyellow;
        border-radius: 50px;
      }

      h1 {
        color: #fff;
        text-align: center;
        font-family: "Courier New", Courier, monospace;
        font-size: 40px;
        text-shadow: 2px 2px 4px black;
      }
    </style>
  </head>
  <body>
    <h1>My Profile Card</h1>
    <div class="frame"></div>
  </body>
</html>
